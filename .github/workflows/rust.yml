name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Feature matrix
        run: |
          cargo check --all-targets --no-default-features
          cargo check --all-targets --no-default-features --features webhook-axum
          cargo check --all-targets --no-default-features --features webhook-actix
          cargo check --all-targets --no-default-features --features digital-id,socks-proxy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests and doctests
        run: cargo test --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --all-features --no-deps
      - name: Package contents
        run: cargo package

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Check minimum supported Rust
        run: cargo check --all-targets --all-features
